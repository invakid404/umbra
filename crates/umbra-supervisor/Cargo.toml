[package]
name = "umbra-supervisor"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# Forwarded to `umbra-overlay`; see its manifest for what each probe breaks and
# why they are compile-time only. Nothing in this crate reads them.
mutation-probe-read = ["umbra-overlay/mutation-probe-read"]
mutation-probe-write = ["umbra-overlay/mutation-probe-write"]
mutation-probe-fstat = ["umbra-overlay/mutation-probe-fstat"]
mutation-probe-dircache = ["umbra-overlay/mutation-probe-dircache"]
# **The one probe that lives in this crate rather than being forwarded.** The
# production `DirectoryEncoder` is here -- see `directory.rs` for why it cannot
# be in the ABI backend -- so the probe that corrupts a directory reply is here
# with it. It reverses each entry's name: every length, offset and alignment in
# the reply stays valid, so what breaks is the *content* and nothing else, and a
# test that passes with it enabled is a test that never read the names back.
mutation-probe-readdir = []

[dependencies]
tracing.workspace = true
# Run and operation identities are allocated here, so the generator is a direct
# dependency rather than something borrowed from a backend crate.
uuid.workspace = true
umbra-core = { path = "../umbra-core" }
umbra-platform = { path = "../umbra-platform" }
umbra-storage = { path = "../umbra-storage" }
umbra-overlay = { path = "../umbra-overlay" }
umbra-journal = { path = "../umbra-journal" }
umbra-agent = { path = "../umbra-agent" }

[dev-dependencies]
tempfile.workspace = true
# `tests/kernel_refusal.rs` binds a real `Overlay` to real storage on
# tempdirs; this is the only backend a test target here selects.
umbra-storage-local = { path = "../umbra-storage-local" }
# `tests/reopen.rs` builds a run's durable journal state directly, then reopens
# it through the real provider executables, so it needs the backend as a library
# as well as the binary cargo already builds for the workspace.
umbra-journal-file = { path = "../umbra-journal-file" }
uuid.workspace = true
