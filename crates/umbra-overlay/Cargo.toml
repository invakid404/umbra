[package]
name = "umbra-overlay"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# Mutation probes for the userspace-routing data path. Each one BREAKS routing in
# one direction, on purpose, so a test can prove the end-to-end fixture actually
# depends on that direction rather than passing for some other reason.
#
# They are cargo features and not runtime switches deliberately: a release build
# contains neither, so no product binary carries a door that turns off the data
# path. This follows the rejection of a "test-only override" in the sandbox for
# the same reason.
#
# They are separate features rather than one because they must be provable
# *separately*. With several compiled in, a failing tracee would not say which
# one broke it, and each probe is chosen so its failure is distinguishable
# anyway -- the read probe makes the toy's compare reject (exit 8), the write
# probe makes its read-back come up short (exit 7), and the fstat probe leaves
# `touch`'s created file in place while the utility exits nonzero, which neither
# of the other two can produce.
#
# Never enable any of them in anything but a mutation test.
mutation-probe-read = []
mutation-probe-write = []
# `fstat` on a virtual descriptor answers `EBADF` instead of the emulated
# metadata -- exactly what the tracee received before the call was routed.
# `mutation_probe_fstat_makes_touch_fail_while_still_creating_the_file`, in
# `crates/umbra-storage-nfs-userspace/tests/userspace_run.rs`, asserts that
# `touch` then fails while still creating its file, which is the discriminator:
# no other probe leaves that pair. It lives there rather than beside the
# rewrite-backed matrices because the read-back has to go through the userspace
# NFS client -- nothing is mounted on a routed run -- and because `fstat` is
# only load-bearing where the descriptor is virtual.
mutation-probe-fstat = []
# The `close` eviction of the residual directory-page cache in `Engine::commit`
# removed, restoring the measured pre-fix behaviour recorded at
# `resolve_routed_close`: a program that listed a directory, closed it and
# listed it again got the first page's names and then nothing, exit 0, because
# `resolve_directory` prefers a cached remainder over a fresh `merged`. The
# insert, the routing and the journalling all stay, so what breaks is only the
# *second* enumeration's names.
#
# `a_project_tree_listing_paginates_and_survives_a_reused_descriptor_number`'s
# sibling probe case in `crates/umbra-storage-nfs-userspace/tests/
# userspace_run.rs` asserts on those names and their bytes rather than on an
# exit code, because the pre-fix disposition exits 0 -- which is exactly why an
# exit code cannot discriminate it.
mutation-probe-dircache = []

[dependencies]
umbra-core = { path = "../umbra-core" }
umbra-storage = { path = "../umbra-storage" }
umbra-journal = { path = "../umbra-journal" }

[dependencies.serde]
workspace = true

[dependencies.tracing]
workspace = true

[dev-dependencies]
umbra-storage-local = { path = "../umbra-storage-local" }
tempfile.workspace = true
uuid.workspace = true
