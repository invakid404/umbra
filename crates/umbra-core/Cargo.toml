[package]
name = "umbra-core"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# Explicit owned-child adapter for protocol contract tests only.
test-owned-exit = []
# Explicit startup descriptor/process census; absent from ordinary builds.
cost-witness = []
# Explicit transport-stage durations for startup qualification.
startup-witness = []

[dependencies]
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "net", "stdio", "event"] }
