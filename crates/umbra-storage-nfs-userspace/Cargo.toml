[package]
name = "umbra-storage-nfs-userspace"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
# Raw-RPC libnfs transport (`raw_rpc`). Off by default, so a default workspace
# build needs no native toolchain: enabling it builds the pinned libnfs from
# `third_party/libnfs` and generates the allowlisted raw FFI.
transport-raw = []

[dependencies]
umbra-core = { path = "../umbra-core" }
umbra-storage = { path = "../umbra-storage" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# `tests/userspace_run.rs` drives the real `umbra` binary against the live
# fixture and then checks the result three independent ways: through the raw
# client (this crate), through the run's journal (these two), and against the
# host. None of them is reachable from the crate's own surface alone.
umbra-journal = { path = "../umbra-journal" }
umbra-journal-file = { path = "../umbra-journal-file" }
# The production `getattrlistbulk` record encoder. `userspace_run.rs` asserts
# that the project-tree listing case really does need more than one reply by
# calling `dirents::encode` itself, rather than transcribing the record-size
# formula test-side where it could drift from the encoder it is modelling. A
# dev-dependency, so no product binary gains an edge.
umbra-platform = { path = "../umbra-platform" }
tempfile.workspace = true
# `userspace_run.rs` asserts, executably, that no NFS mount covers the run --
# the addendum's guard against the whole end-to-end proof being an illusion.
# `getmntinfo` is the only way to ask that without parsing `mount(8)`.
libc = "=0.2.189"
uuid.workspace = true

[build-dependencies]
# Not optional: a build script cannot be conditionally compiled on a feature,
# so bindgen is always available and `build.rs` returns early when the
# `transport-raw` feature is off.
bindgen = "=0.73.2"
