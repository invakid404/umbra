[package]
name = "umbra-cli"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "umbra"
path = "src/main.rs"

[features]
# Forwarded to `umbra-overlay` through `umbra-supervisor`; see that manifest.
# Building the `umbra` binary with one of these is how
# `crates/umbra-storage-nfs-userspace/tests/userspace_run.rs` gets a supervisor
# whose routing is broken in exactly one direction. The tests live there, not
# here, because the read-back has to go through the userspace NFS client.
mutation-probe-read = [
    "umbra-supervisor/mutation-probe-read",
    "umbra-overlay/mutation-probe-read",
]
mutation-probe-write = [
    "umbra-supervisor/mutation-probe-write",
    "umbra-overlay/mutation-probe-write",
]

[dependencies]
clap.workspace = true
uuid.workspace = true
umbra-core = { path = "../umbra-core" }
umbra-supervisor = { path = "../umbra-supervisor" }
umbra-agent = { path = "../umbra-agent" }
umbra-platform = { path = "../umbra-platform" }
umbra-storage = { path = "../umbra-storage" }
umbra-journal = { path = "../umbra-journal" }
umbra-overlay = { path = "../umbra-overlay" }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# `tests/resume_cli.rs` builds a crashed run's durable state, then reopens it
# through the real `umbra` binary and the real provider executables, which is the
# only way to assert the command's exit code on a recovery-required run.
umbra-core = { path = "../umbra-core" }
umbra-journal = { path = "../umbra-journal" }
umbra-journal-file = { path = "../umbra-journal-file" }
umbra-storage = { path = "../umbra-storage" }
umbra-storage-local = { path = "../umbra-storage-local" }
umbra-supervisor = { path = "../umbra-supervisor" }
uuid.workspace = true
