NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_UDP = false;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}
NFSv4 {
    Minor_Versions = 0, 1;
    RecoveryBackend = fs_ng;
    Lease_Lifetime = 10;
    Grace_Period = 10;
    Delegations = false;
}
EXPORT_DEFAULTS {
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    Squash = Root_Squash;
}
EXPORT {
    Export_Id = 1;
    Path = /export/umbra;
    Pseudo = /umbra;
    Access_Type = RW;
    Attr_Expiration_Time = 0;
    FSAL { Name = VFS; }
}
LOG {
    Default_Log_Level = WARN;
}
