name: umbra-m1-transport-raw
services:
  # Service name is 'ganesha' so the composed container name is
  # 'umbra-m1-transport-raw-ganesha', which the transport-raw test suite
  # names via UMBRA_NFS_FIXTURE_CONTAINER for its restart cases.
  ganesha:
    build: .
    image: umbra-nfs-ganesha-raw:local
    hostname: umbra-m1-transport-raw
    container_name: umbra-m1-transport-raw-ganesha
    # `restart: no` matters for the SIGKILL-restart cases: an auto-restart
    # policy races the test's own `docker start`, and its
    # `wait_until_serving` probe can then see an already-live server before
    # the restart lifecycle has actually re-entered its startup state.
    # With `no`, the test owns that lifecycle.
    restart: "no"
    cap_add:
      - DAC_READ_SEARCH
    # Loopback only. Port 12105 (not 2049) so this coexists with any real
    # NFS server on the host without collision.
    ports:
      - "127.0.0.1:12105:2049/tcp"
    volumes:
      - export-data:/export
      - umbra-data:/umbra
      - recovery-data:/var/lib/nfs/ganesha
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/rpc-check.py", "127.0.0.1"]
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 5s
    stop_grace_period: 30s
volumes:
  export-data:
  umbra-data:
  recovery-data:
