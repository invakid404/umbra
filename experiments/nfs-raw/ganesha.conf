NFS_CORE_PARAM {
    Protocols = 4;
    # Host networking (see docker-compose.yml): Ganesha binds to the host's
    # 12105 directly, so the client and server share the host's loopback
    # rather than going through Docker's port-publish + docker-proxy pipe
    # that reaps the lease-idle test's flow at ~30s on the GitHub Actions
    # Ubuntu runner. 12105 is non-standard so this coexists with any real
    # NFS server on the host — the raw-transport suite's convention.
    NFS_Port = 12105;
    Enable_UDP = false;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    # Belt-and-braces past 65s of idle: Ganesha's default RPC idle reap
    # is 300s, which already covers this test, but the raise is explicit
    # and free.
    RPC_Idle_Timeout_S = 3600;
}
NFSv4 {
    Minor_Versions = 0;
    RecoveryBackend = fs_ng;
    # The lease-idle case (`lease_idle_past_the_period_is_kept_alive_...`)
    # asserts the fixture advertises at least a 60s lease so idle renewal has
    # a meaningful window to observe. Keep grace short so restart cases
    # don't drag the runtime.
    Lease_Lifetime = 60;
    Grace_Period = 10;
    Delegations = false;
    # The raw-transport tests speak AUTH_SYS and refuse identity attributes in
    # string form (`user@domain`) because the provider has qualified no domain
    # identity mapping. Force Ganesha to return FATTR4_OWNER/OWNER_GROUP as
    # numeric strings so an AUTH_SYS-only client can round-trip them.
    Only_Numeric_Owners = true;
}
EXPORT_DEFAULTS {
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    # The raw-transport tests hit AUTH_SYS with whatever uid the process
    # happens to have; No_Root_Squash keeps every uid effective on the export.
    Squash = No_Root_Squash;
}
# Two exports. The raw suite walks /export/{probe,pagedir} for the
# fault-matrix and live-state cases, and /umbra/runs for the golden-compat
# and conformance cases. Both paths must be junctions off the pseudo-root,
# so each export gets its own Pseudo path that matches its on-disk path.
EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /export;
    Access_Type = RW;
    Attr_Expiration_Time = 0;
    FSAL { Name = VFS; }
}
EXPORT {
    Export_Id = 2;
    Path = /umbra;
    Pseudo = /umbra;
    Access_Type = RW;
    Attr_Expiration_Time = 0;
    FSAL { Name = VFS; }
}
LOG {
    Default_Log_Level = WARN;
}
