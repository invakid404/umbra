[workspace]
resolver = "2"
members = [
    "crates/umbra-core",
    "crates/umbra-platform",
    "crates/umbra-platform-macos",
    "crates/umbra-platform-linux",
    "crates/umbra-storage",
    "crates/umbra-storage-nfs",
    "crates/umbra-storage-local",
    "crates/umbra-overlay",
    "crates/umbra-journal",
    "crates/umbra-journal-file",
    "crates/umbra-agent",
    "crates/umbra-agent-codex",
    "crates/umbra-agent-claude",
    "crates/umbra-supervisor",
    "crates/umbra-cli",
]

[workspace.package]
version = "0.1.0"
authors = ["Umbra contributors"]
license = "Unlicense"
edition = "2021"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.20"
tracing = "=0.1.44"
clap = { version = "=4.6.6", features = ["derive"] }
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
mach2 = "=0.7.0"
tempfile = "=3.27.0"
serde_json = "=1.0.151"
