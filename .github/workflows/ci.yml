name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test contract documentation
        run: cargo test --workspace --doc

      - name: Install memoria CLI
        run: cargo install --locked --git https://github.com/viktordanov/rs-memoria --tag v0.2.0 rs-memoria
        # Pinned to rs-memoria's v0.2.0 tag; bump on new releases.

      - name: Memoria documentation gate
        run: memoria --root . check

  native-qualification:
    name: Enforced macOS fixture qualification
    # This runner must provide debugger permission and an existing NFSv4 mount.
    runs-on: [self-hosted, macOS, ARM64, umbra-integration]
    timeout-minutes: 15
    env:
      UMBRA_INTEGRATION_REQUIRED: "1"
      UMBRA_TEST_NFS_ROOT: ${{ vars.UMBRA_TEST_NFS_ROOT }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build providers and fixture
        run: |
          test "$(uname -m)" = arm64
          test -n "$UMBRA_TEST_NFS_ROOT"
          cargo build --workspace --bins
          fixture_dir=$(mktemp -d)
          clang -arch arm64 experiments/fixtures/umbra-test-child.c -o "$fixture_dir/umbra-test-child"
          mkdir "$fixture_dir/shadow"
          echo "UMBRA_TEST_FIXTURE_PATH=$fixture_dir/umbra-test-child" >> "$GITHUB_ENV"
          echo "UMBRA_TEST_REDIRECT_ROOT=$fixture_dir/shadow" >> "$GITHUB_ENV"
      - name: Qualify enforcement, IPC, and all fourteen run fixtures
        run: |
          cargo test -p umbra-platform-macos --test sandbox_launch --test provider_ipc --test fixtures -- --nocapture --test-threads=1
          cargo test -p umbra-cli --test run_fixtures -- --nocapture --test-threads=1
