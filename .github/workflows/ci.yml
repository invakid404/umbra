name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # New namespace excludes older archives that contained target/.
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      # Test harness artifacts do not supply the standalone provider executables
      # at `target/debug/umbra-storage-local` and friends on a clean checkout.
      # The reopen suites spawn those provider executables, and without this they would skip here and run
      # nowhere. Linking them is cheap at this point: every dependency is already
      # built by the three steps above.
      - name: Build provider executables for the suites that spawn them
        run: cargo build --workspace --bins

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Managed parent custody after lost acknowledgements
        if: runner.os == 'macOS'
        run: |
          cargo test -p umbra-isolation --test managed_runtime r2_ack_loss_preserves_owner_provider_custody -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime custody_normal_reaps_all -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_guardian_ack_loss_preserves_child_collection -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_relay_ack_loss_preserves_child_collection -- --exact --nocapture

      - name: Managed caller original clock
        if: runner.os == 'macOS'
        run: |
          cargo test -p umbra-isolation --test managed_runtime r2_unknown_start_exit_never_renews -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_library_earlier_start_after_local_ticket -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_library_earlier_start_after_observation -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_total_publication_loss_preserves_custody -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_grace_exhaustion_is_loud -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_library_relay_stalls_before_start -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_guardian_stalls_before_first_trigger -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_library_owner_start_relay_stalled_worker_alive -- --exact --nocapture
          cargo test -p umbra-isolation --test managed_runtime r2_library_received_start_forwarded_before_origin_exit -- --exact --nocapture

      - name: Managed owner observation with inherited descriptor
        if: runner.os == 'macOS'
        run: cargo test -p umbra-isolation --test managed_runtime r2_owner_exit_with_inherited_fd -- --exact --nocapture

      - name: Cleanup helper creation and handoff failure
        run: cargo test -p umbra-platform --lib provider::closing::tests::r2_reaper_creation_failure -- --exact --nocapture

      - name: Cleanup progress cannot renew the original grace window
        run: cargo test -p umbra-platform --lib provider::closing::tests::r2_grace_exhaustion_is_loud -- --exact --nocapture

      - name: Managed watch registration failure and exit ordering
        if: runner.os == 'macOS'
        run: cargo test -p umbra-isolation --lib managed::process::tests::custody_watch_registration_race -- --exact --nocapture

      - name: Custody shares the original helper deadline window
        if: runner.os == 'macOS'
        run: cargo test -p umbra-isolation --lib managed::guard::policy_tests::custody_ticket_deadlines -- --exact --nocapture

      - name: Managed worker fail-stop after publication failure
        if: runner.os == 'macOS'
        run: cargo test -p umbra-isolation --test managed_startup r2_ticket_publication_all_writes_fail -- --exact --nocapture

      - name: Independent cancellation of accepted ordinary work
        if: runner.os == 'macOS'
        run: cargo test -p umbra-platform-macos --lib native::cancellation_tests::r2_preaccepted_work_cancel -- --exact --nocapture

      - name: RSP cancellation preserves the stream
        if: runner.os == 'macOS'
        run: |
          cargo test -p umbra-platform-macos --lib rsp::tests::r3_cancel_ordinary_request_same_stream -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib rsp::tests::r3_cancel_partial_write -- --exact --nocapture

      - name: Test contract documentation
        run: cargo test --workspace --doc

  raw-transport:
    name: Raw NFS transport (ubuntu-latest)
    # The transport-raw suite links libnfs and drives NFSv4.0 straight over TCP
    # to a Ganesha fixture. Both prerequisites are Linux-only in this shape, so
    # this job does not join the `rust` matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # libnfs.pin is the source of truth; anything else must equal it.
      LIBNFS_PIN: 18c5c73ee88bb7dc8da0d55dc95164bb77e49dc6
      UMBRA_LIBNFS_SRC: ${{ github.workspace }}/third_party/libnfs
      UMBRA_NFS_RAW_FIXTURE: 127.0.0.1:12105
      UMBRA_NFS_FIXTURE_CONTAINER: umbra-m1-transport-raw-ganesha
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Install libnfs build dependencies and tcpdump
        # cmake drives the libnfs build; libclang-dev is bindgen's
        # requirement. tcpdump is for the wire capture below, kept in the
        # same apt call to save one package-cache update.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev tcpdump

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-raw-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-raw-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache pinned libnfs checkout
        id: libnfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/libnfs
          # The pin is the entire cache identity; a bump invalidates cleanly.
          key: libnfs-src-${{ hashFiles('crates/umbra-storage-nfs-userspace/libnfs.pin') }}

      - name: Verify libnfs.pin matches workflow constant
        run: |
          pinned=$(grep -v '^\s*#' crates/umbra-storage-nfs-userspace/libnfs.pin | tr -d '[:space:]')
          if [ "$pinned" != "$LIBNFS_PIN" ]; then
            echo "libnfs.pin says $pinned but this workflow expects $LIBNFS_PIN" >&2
            exit 1
          fi

      - name: Fetch pinned libnfs source
        if: steps.libnfs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          git clone --filter=blob:none https://github.com/sahlberg/libnfs third_party/libnfs
          git -C third_party/libnfs -c advice.detachedHead=false checkout "$LIBNFS_PIN"

      - name: Build and start the NFS-Ganesha fixture
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            up -d --build --wait --wait-timeout 120
          docker ps --filter name=$UMBRA_NFS_FIXTURE_CONTAINER

      - name: Start wire capture on loopback
        # `-U` flushes each packet so a kill-signalled process still leaves a
        # usable file. The filter matches the published port (12105 on host
        # loopback) and the container's own port (2049) so both sides of the
        # docker-proxy relay are recorded.
        #
        # The redirections have to run *inside* the elevated shell, otherwise
        # sh opens the output files under the runner UID before executing
        # `sudo tcpdump` (SC2024). Wrap the whole invocation in `sudo sh -c`
        # so both the fd creation and the process itself are root.
        run: |
          sudo sh -c 'tcpdump -i any -w /tmp/nfs.pcap -U -s 0 \
              "port 12105 or port 2049" \
              > /tmp/tcpdump.stdout 2> /tmp/tcpdump.stderr &
              echo $! > /tmp/tcpdump.pid'
          # Let libpcap open its BPF filter before tests start dispatching.
          sleep 2

      - name: Run transport-raw suite
        # `--tests` runs unit tests inside the crate and every integration
        # target under `tests/`. `--test-threads=1` is required by the live
        # cases that restart the fixture (`tests/live_state.rs`); the tests
        # can otherwise clobber each other on the shared server.
        #
        # The 10 finding-tagged tests named in issue #32 — four in
        # `src/transport/raw/pump.rs`, three in `src/transport/raw/mod.rs`,
        # two in `tests/live_state.rs`, and one in `tests/fault_matrix.rs` —
        # all execute and pass under this fixture, alongside the rest of
        # the raw-transport suite.
        #
        # `--skip the_namespace_mutations_the_hotfix_added_run_end_to_end`:
        # the raw transport asks REMOVE for atomic `change_info4`
        # (RFC 7530 §14.2), which NFS-Ganesha's VFS FSAL cannot supply
        # because `unlinkat(2)` yields no atomic before/after
        # directory-change tracking. This is a fixture-capability gap, not
        # a code gap; the same test passes under the mounted adapter in
        # `crates/umbra-storage-nfs`. Lifting the skip is tracked as future
        # work once a Ganesha FSAL with atomic REMOVE lands here.
        run: |
          cargo test \
              -p umbra-storage-nfs-userspace \
              --features transport-raw \
              --tests \
              -- --test-threads=1 --nocapture \
              --skip the_namespace_mutations_the_hotfix_added_run_end_to_end

      - name: Stop wire capture
        if: always()
        run: |
          if [ -f /tmp/tcpdump.pid ]; then
            sudo kill -INT "$(cat /tmp/tcpdump.pid)" 2>/dev/null || true
            # Give tcpdump a moment to finish flushing.
            sleep 1
          fi
          sudo chown "$USER" /tmp/nfs.pcap 2>/dev/null || true
          ls -l /tmp/nfs.pcap 2>&1 || true

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker logs "$UMBRA_NFS_FIXTURE_CONTAINER" \
            > /tmp/ganesha.log 2>&1 || true
          docker inspect "$UMBRA_NFS_FIXTURE_CONTAINER" \
            --format '{{json .State.Health}}' \
            > /tmp/ganesha-health.json 2>&1 || true
          echo '--- Ganesha log (last 200 lines) ---'
          tail -200 /tmp/ganesha.log
          echo '--- Health state ---'
          cat /tmp/ganesha-health.json
          echo

      - name: Upload raw-transport diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-transport-diagnostics
          path: |
            /tmp/nfs.pcap
            /tmp/ganesha.log
            /tmp/ganesha-health.json
            /tmp/tcpdump.stdout
            /tmp/tcpdump.stderr
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down the fixture
        if: always()
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            down -v

  native-qualification:
    name: Enforced macOS fixture qualification
    # Fork PR code must never run on this persistent, privileged runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # This runner must provide debugger permission and an existing NFSv4 mount.
    runs-on: [self-hosted, macOS, ARM64, umbra-integration]
    timeout-minutes: 15
    env:
      UMBRA_INTEGRATION_REQUIRED: "1"
      # Opt out of nfs_fixture_matrix in CI. The live-NFSv4-mount end-to-end
      # test remains in the suite and runs in local dev; on macOS Sequoia/Tahoe
      # self-hosted runners the TCC SystemPolicyNetworkVolumes gate blocks
      # openat on the mount point from a launchd context, and the PPPC
      # bypass would require user-approved MDM. The userspace NFS backend
      # has its own native-userspace-routing job. These skipped matrices still
      # require a kernel NFS mount, so that backend does not remove this skip.
      UMBRA_TEST_SKIP_NFS_MATRIX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # #205: launchd-parented zombies of this user, at the start of the job.
      # A traced program the kernel hands to launchd when its debugger ends
      # mid-exit is never collected; it stays until a reboot and counts
      # against kern.maxprocperuid. The census is per user, so a local run by
      # anyone on this host during the job is counted too.
      - name: Zombie census at job start (#205)
        run: |
          census="$RUNNER_TEMP/umbra-zombies-start.txt"
          ps -A -o stat=,pid=,ppid=,user=,lstart=,ucomm= \
            | awk -v u="$(id -un)" '$1 ~ /^Z/ && $3 == 1 && $4 == u' > "$census"
          date +%s > "$RUNNER_TEMP/umbra-job-start.txt"
          echo "launchd-parented zombies of $(id -un) at job start: $(wc -l < "$census")"
          cat "$census"
          # Report only: zombies born since the previous job on this runner ended.
          previous="${RUNNER_TOOL_CACHE:-$HOME}/umbra-ci-zombies-end.txt"
          if [ -f "$previous" ]; then
            echo "born since the previous job's end census (report only):"
            awk 'FILENAME == ARGV[1] { seen[$2 " " $5 " " $6 " " $7 " " $8 " " $9] = 1; next }
                 !(($2 " " $5 " " $6 " " $7 " " $8 " " $9) in seen)' "$previous" "$census" || true
          fi
      - name: Build providers and fixture
        run: |
          test "$(uname -m)" = arm64
          cargo build --workspace --bins
          fixture_dir=$(mktemp -d)
          clang -arch arm64 experiments/fixtures/umbra-test-child.c -o "$fixture_dir/umbra-test-child"
          mkdir "$fixture_dir/shadow"
          echo "UMBRA_TEST_FIXTURE_PATH=$fixture_dir/umbra-test-child" >> "$GITHUB_ENV"
          echo "UMBRA_TEST_REDIRECT_ROOT=$fixture_dir/shadow" >> "$GITHUB_ENV"
          # #205 native control: debugger-last orderings, signed so its own
          # debugger process may attach to its child (get-task-allow).
          clang -arch arm64 -O1 -Wall -Wextra -Werror experiments/fixtures/umbra-fix-205-exitwin.c -o "$fixture_dir/umbra-fix-205-exitwin"
          codesign --force --sign - --entitlements experiments/fixtures/umbra-fix-205-exitwin.entitlements "$fixture_dir/umbra-fix-205-exitwin"
          echo "UMBRA_FIX205_EXITWIN=$fixture_dir/umbra-fix-205-exitwin" >> "$GITHUB_ENV"
      - name: Signal authority and overlapping library calls
        run: |
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          clang -arch arm64 -O1 -Wall -Wextra -Werror experiments/fixtures/umbra-fix-284-signals.c -o "$GITHUB_WORKSPACE/target/debug/umbra-fix-284-signals"
          export UMBRA_F284_SIGNALS="$GITHUB_WORKSPACE/target/debug/umbra-fix-284-signals"
          echo "UMBRA_F284_SIGNALS=$UMBRA_F284_SIGNALS" >> "$GITHUB_ENV"
          cargo test -p umbra-platform-macos --lib signals::tests::f284_delivery_errors -- --exact --nocapture
          for case in f284_sibling_window_stop_refuses_before_delivery f284_signal_cause_precedes_return_pc f284_backend_rejects_duplicate_and_cross_exec_tokens f284_transport_timeout f284_transport_disconnect f284_transport_partial f284_transport_completed; do
            cargo test -p umbra-platform-macos --lib "native::retirement_controls::$case" -- --exact --nocapture
          done
          cargo test -p umbra-supervisor --test observer_failure f284_same_process_overlap -- --exact --nocapture

      - name: Qualify enforcement, IPC, and the local run-fixture matrix
        run: |
          cargo test -p umbra-platform-macos --lib native::tests::owner_loss_wakes_a_pending_rsp_request -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib native::teardown_tests:: -- --nocapture --test-threads=1
          cargo test -p umbra-platform-macos --lib rsp::tests::r3_cancel_ordinary_request_same_stream -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib rsp::tests::r3_cancel_partial_write -- --exact --nocapture
          cargo test -p umbra-platform-macos --test sandbox_launch --test provider_ipc --test fixtures --test idle_poll -- --nocapture --test-threads=1
          # #205: the launchd-zombie and teardown decisions, the stub resolution,
          # debugserver's ignored terminal signals, and the provider's lifetime.
          cargo test -p umbra-platform-macos --lib native::tests::every_traced_stub_resolves_on_this_host -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib native::tests::a_tracee_handed_to_launchd_is_never_confirmed -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib native::tests::the_teardown_opens_by_continuing_its_tracer -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib native::tests::a_reaped_tracer_is_never_continued -- --exact --nocapture
          cargo test -p umbra-platform-macos --lib rsp::tests::debugserver_ignores_terminal_signals -- --exact --nocapture
          cargo test -p umbra-platform-macos --test lifetime_signals -- --nocapture --test-threads=1
          cargo test -p umbra-platform-macos --test owner_loss -- --nocapture --test-threads=1
          cargo test -p umbra-cli --test run_fixtures --test resume_cli --test fix_262_idle -- --nocapture --test-threads=1
          cargo test -p umbra-supervisor --test reopen -- --nocapture --test-threads=1
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          cargo update --manifest-path experiments/fixtures/umbra-fix-227-observer-providers/Cargo.toml \
            -p umbra-platform -p umbra-core -p umbra-journal -p umbra-journal-file -p umbra-storage -p umbra-storage-local
          git diff --stat -- experiments/fixtures/umbra-fix-227-observer-providers/Cargo.lock
          cargo build --locked --manifest-path experiments/fixtures/umbra-fix-227-observer-providers/Cargo.toml --target-dir "$GITHUB_WORKSPACE/target"
          cargo test -p umbra-supervisor --test observer_failure -- --nocapture --test-threads=1
      - name: Qualify adopted stdio ownership and launch consumption
        run: |
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          clang -arch arm64 -O1 -Wall -Wextra -Werror experiments/fixtures/umbra-fix-201-stdio.c -o "$GITHUB_WORKSPACE/target/debug/umbra-fix-201-stdio"
          export UMBRA_STDIO_FIXTURE="$GITHUB_WORKSPACE/target/debug/umbra-fix-201-stdio"
          cargo test -p umbra-platform-macos --test launch_stdio -- --nocapture --test-threads=1
          cargo test -p umbra-core ambiguous_stdio_ack_closes_transport_and_all_writer_copies -- --nocapture
      - name: Qualify packed spawn layouts and kernel-readable backing
        env:
          UMBRA_F247_EVIDENCE: /tmp/spawn-abi-247-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          cargo test -p umbra-platform-macos --lib f247_ -- --nocapture --test-threads=1
          cargo test -p umbra-platform-macos --test spawn_abi_247 f247_native_attribute_prefix_boundary -- --exact --nocapture --test-threads=1

      - name: Preserve packed spawn boundary observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-spawn-boundary
          path: /tmp/spawn-abi-247-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn

      - name: Qualify completed-child resource retirement
        env:
          UMBRA_RETIREMENT_WITNESS: "1"
        run: |
          cargo build -p umbra-platform-macos --features retirement-witness --bin umbra-platform-macos
          cargo test -p umbra-platform-macos --lib retirement_ -- --nocapture
          cargo test -p umbra-cli --test child_retention -- --nocapture --test-threads=1
      - name: Qualify shutdown inventory and owner destruction
        env:
          UMBRA_RETIREMENT_WITNESS: "1"
          UMBRA_FIX_271_EVIDENCE_FILE: /tmp/umbra-shutdown-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
        run: |
          cargo build --workspace --bins --features umbra-platform-macos/retirement-witness,umbra-platform-macos/shutdown-witness
          cargo test -p umbra-platform-macos -p umbra-cli --features umbra-platform-macos/retirement-witness,umbra-platform-macos/shutdown-witness --test shutdown_ledger --test child_retention -- --nocapture --test-threads=1
          python3 - <<'PY'
          import json, os
          from collections import Counter
          rows = [json.loads(line) for line in open(os.environ["UMBRA_FIX_271_EVIDENCE_FILE"])]
          transports = {row["nonce"]: row for row in rows if row["event"] == "transport-final"}
          exits = [row for row in rows if row["event"] == "final-to-exit"]
          assert exits, "no Final-to-exit readings"
          for row in exits:
              assert row["timing_origin"] == "final-decoded", row
              owner = transports[row["nonce"]]
              assert owner["instance"] == row["accepted"]["instance"]
              actual = Counter((r["kind"], r["pid"]) for r in rows
                               if r["event"] == "acquired" and r["writer_instance"] == owner["writer_instance"])
              recorded = Counter((e["slot"]["kind"], e["identity"]["pid"]) for e in row["final"]["entries"]
                                 if e["identity"] is not None)
              assert actual == recorded, (actual - recorded, recorded - actual)
              print("shutdown Final-to-exit:", row["nanos"], "ns", "acquisitions:", sum(actual.values()))
              assert row["proof"] and row["exit_ok"] and int(row["nanos"]) <= 50_000_000, row
          PY
      # #193: this runner's jobs run in launchd's session (SID 1), the one place
      # `umbra run` isolates itself. The isolation suite's SID-1 cases (P1-P4,
      # topology, cleanup) skip in any other session, so here a different
      # session is a failure, not a skip. The pty cases pin today's terminal
      # semantics, which the isolation must leave alone.
      - name: Qualify run isolation in launchd's session
        # #205: run even when an earlier step failed, so the SID-1 cases always
        # give their reading (a failing step otherwise hides every later one).
        if: ${{ !cancelled() }}
        env:
          UMBRA_REQUIRE_SID1: "1"
        run: |
          cargo test -p umbra-isolation -- --nocapture --test-threads=1
          cargo test -p umbra-cli --test isolation -- --nocapture --test-threads=1
          # Named SID-1 stdio contract: exact delivery and EOF by CLI exit.
          cargo test -p umbra-cli --test isolation f201_pipe_eof_isolated -- --exact --nocapture --test-threads=1
      # #205: fail the job on any launchd-parented zombie of this user born
      # during it, listed by pid, start time and name, and on any live process
      # of the run left behind (the runner's own post-job cleanup would end such
      # a process after this step, and the next job would take the zombie as its
      # baseline). A live process of the run is an `umbra*` image, a traced
      # program's resigned twin (its command line, or its executable path read
      # with proc_pidpath, is under ~/Library/Caches/umbra/twins, so a twin that
      # keeps a vendor argv[0] is found too), or umbra's debugserver (its argv
      # carries `--reverse-connect 127.0.0.1:`). A process whose executable path
      # cannot be read is listed as a leftover; only one proven gone or a zombie (ESRCH) is
      # skipped. Zombies are counted above, not again as leftovers. Both checks
      # read ONE process table, so a process cannot be live in the zombie check
      # and a zombie in the leftover check; a failed `ps` fails the step. The
      # baseline is the first file by name, so an empty baseline still reports
      # every new zombie.
      - name: Zombie and leftover census at job end (#205)
        if: always()
        run: |
          set -o pipefail
          start="$RUNNER_TEMP/umbra-zombies-start.txt"
          end="$RUNNER_TEMP/umbra-zombies-end.txt"
          snapshot="$RUNNER_TEMP/umbra-processes-end.txt"
          # One process table for both checks. Its first nine fields match the
          # start census (stat, pid, ppid, user, lstart), so the zombie keys
          # ($2 and $5-$9) compare as before.
          if ! ps -A -o stat=,pid=,ppid=,user=,lstart=,etime=,ucomm=,command= > "$snapshot"; then
            echo "::error::the end census produced no reading (#205)"
            exit 1
          fi
          awk -v u="$(id -un)" '$1 ~ /^Z/ && $3 == 1 && $4 == u' "$snapshot" > "$end"
          cp "$end" "${RUNNER_TOOL_CACHE:-$HOME}/umbra-ci-zombies-end.txt" || true
          touch "$start"
          new=$(awk 'FILENAME == ARGV[1] { seen[$2 " " $5 " " $6 " " $7 " " $8 " " $9] = 1; next }
                     !(($2 " " $5 " " $6 " " $7 " " $8 " " $9) in seen)' "$start" "$end")
          job_start=$(cat "$RUNNER_TEMP/umbra-job-start.txt" 2>/dev/null || echo 0)
          window=$(( $(date +%s) - job_start ))
          me=$$
          status=0
          # awk marks the name and argv matches (1) and passes every other
          # candidate (0) to proc_pidpath. The helper never spells the twin
          # path in one literal, so its own command line cannot match it.
          leftovers=$(set -o pipefail
            awk -v u="$(id -un)" -v window="$window" -v me="$me" '
            function seconds(t,  n, a, d, h, m, s) {
              d = 0; h = 0
              if (index(t, "-") > 0) { split(t, a, "-"); d = a[1]; t = a[2] }
              n = split(t, a, ":")
              if (n == 3) { h = a[1]; m = a[2]; s = a[3] } else { m = a[1]; s = a[2] }
              return ((d * 24 + h) * 60 + m) * 60 + s
            }
            $4 == u && $2 != me && $3 != me && $1 !~ /^Z/ && seconds($10) <= window {
              name = $11
              hit = (name ~ /^umbra/ || $0 ~ /\/Library\/Caches\/umbra\/twins\// ||
                     (name == "debugserver" && $0 ~ /--reverse-connect 127\.0\.0\.1:/))
              print (hit ? 1 : 0), $0
            }' "$snapshot" | python3 -I -c '
          import ctypes, sys
          libc = ctypes.CDLL("/usr/lib/libSystem.B.dylib", use_errno=True)
          libc.proc_pidpath.argtypes = [ctypes.c_int, ctypes.c_void_p, ctypes.c_uint32]
          twins = "/Library/Caches/umbra/" "twins/"
          for line in sys.stdin:
              hit, _, row = line.rstrip("\n").partition(" ")
              if hit == "1":
                  print(row)
                  continue
              buf = ctypes.create_string_buffer(4096)
              ctypes.set_errno(0)
              n = libc.proc_pidpath(int(row.split()[1]), buf, 4096)
              if n > 0:
                  path = buf.raw[:n].decode("utf-8", "replace")
                  if twins in path:
                      print(row + "  [executable " + path + "]")
              elif ctypes.get_errno() != 3:
                  print(row + "  [executable path unreadable: errno %d]" % ctypes.get_errno())
          ') || {
            echo "::error::the leftover census produced no reading (#205)"
            status=1
          }
          if [ -n "$new" ]; then
            echo "::error::launchd-parented zombies born during this job (#205):"
            echo "$new"
            status=1
          fi
          if [ -n "$leftovers" ]; then
            echo "::error::live processes of the run left at job end (#205):"
            echo "$leftovers"
            status=1
          fi
          [ "$status" -eq 0 ] && echo "no new launchd-parented zombie and no leftover"
          exit "$status"

  native-userspace-routing:
    name: Userspace-routed run over the live NFSv4 client
    # Fork PR code must never run on this persistent, privileged runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The same runner as `native-qualification`: it provides debugger
    # permission, which a supervised launch needs, and Docker for the fixture.
    # A routed run needs both halves and neither is available elsewhere -- the
    # Linux transport-raw job has the server but no tracer, and the macOS
    # qualification job has the tracer but no server.
    runs-on: [self-hosted, macOS, ARM64, umbra-integration]
    timeout-minutes: 30
    env:
      # A missing fixture is a failure here, not a skip. These are the slice's
      # mandatory proofs: an end-to-end run, and two mutations that must break
      # it in different directions.
      UMBRA_INTEGRATION_REQUIRED: "1"
      LIBNFS_PIN: 18c5c73ee88bb7dc8da0d55dc95164bb77e49dc6
      UMBRA_LIBNFS_SRC: ${{ github.workspace }}/third_party/libnfs
      UMBRA_NFS_RAW_FIXTURE: 127.0.0.1:12105
      UMBRA_NFS_FIXTURE_CONTAINER: umbra-m1-transport-raw-ganesha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # #205: launchd-parented zombies of this user, at the start of the job.
      # A traced program the kernel hands to launchd when its debugger ends
      # mid-exit is never collected; it stays until a reboot and counts
      # against kern.maxprocperuid. The census is per user, so a local run by
      # anyone on this host during the job is counted too.
      - name: Zombie census at job start (#205)
        run: |
          census="$RUNNER_TEMP/umbra-zombies-start.txt"
          ps -A -o stat=,pid=,ppid=,user=,lstart=,ucomm= \
            | awk -v u="$(id -un)" '$1 ~ /^Z/ && $3 == 1 && $4 == u' > "$census"
          date +%s > "$RUNNER_TEMP/umbra-job-start.txt"
          echo "launchd-parented zombies of $(id -un) at job start: $(wc -l < "$census")"
          cat "$census"
          # Report only: zombies born since the previous job on this runner ended.
          previous="${RUNNER_TOOL_CACHE:-$HOME}/umbra-ci-zombies-end.txt"
          if [ -f "$previous" ]; then
            echo "born since the previous job's end census (report only):"
            awk 'FILENAME == ARGV[1] { seen[$2 " " $5 " " $6 " " $7 " " $8 " " $9] = 1; next }
                 !(($2 " " $5 " " $6 " " $7 " " $8 " " $9) in seen)' "$previous" "$census" || true
          fi

      - name: Verify libnfs.pin matches workflow constant
        run: |
          pinned=$(grep -v '^\s*#' crates/umbra-storage-nfs-userspace/libnfs.pin | tr -d '[:space:]')
          if [ "$pinned" != "$LIBNFS_PIN" ]; then
            echo "libnfs.pin says $pinned but this workflow expects $LIBNFS_PIN" >&2
            exit 1
          fi

      - name: Fetch pinned libnfs source
        run: |
          if [ ! -d third_party/libnfs ]; then
            mkdir -p third_party
            git clone --filter=blob:none https://github.com/sahlberg/libnfs third_party/libnfs
          fi
          git -C third_party/libnfs fetch --depth 1 origin "$LIBNFS_PIN" || true
          git -C third_party/libnfs -c advice.detachedHead=false checkout "$LIBNFS_PIN"

      - name: Build and start the NFS-Ganesha fixture
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            up -d --build --wait --wait-timeout 180
          docker ps --filter name=$UMBRA_NFS_FIXTURE_CONTAINER

      - name: Build the toy, edge, listing, Rust I/O, buffered-output, no-follow, symlink-read and process-lifecycle fixtures
        run: |
          test "$(uname -m)" = arm64
          fixture_dir=$(mktemp -d)
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-toy.c \
            -o "$fixture_dir/umbra-userspace-toy"
          # The edge fixture carries the round-1 regressions: a routed ENOENT, a
          # routed EFAULT, a transfer past the backend's per-call bound, an
          # O_TRUNC of a non-empty object, and a file-touching library
          # initializer. Each was a dead run or a wrong errno.
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-edges.c \
            -o "$fixture_dir/umbra-userspace-edges"
          # The listing fixture reads a directory through `fts` with the flags
          # plain `/bin/ls` passes and writes the names it got into the routed
          # workspace. It is how the directory-read proofs assert on *entries*:
          # an exit code cannot tell a correct listing from an empty one.
          # Inherited stdout has separate exact-byte stdio201 controls.
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-listing.c \
            -o "$fixture_dir/umbra-userspace-listing"
          # The project-tree listing fixture is the control's sibling: it
          # enumerates a 239-entry tree twice over one reused descriptor number,
          # reporting the same 239 names each time, and records the number each
          # pass started on. It writes nothing into the directory it reads.
          # It is what covers what the three-name control cannot -- a reply
          # buffer that overflows, so later pages come from the residual-page
          # cache, and a second enumeration on the same descriptor number, whose
          # names prove the cache was evicted.
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-listing-project.c \
            -o "$fixture_dir/umbra-userspace-listing-project"
          # The Rust I/O fixture is the only one here that is not C and not a
          # bare syscall: it reaches the filesystem through `std::fs`'s own
          # wrappers -- File::open, File::metadata, write_all, read_to_end,
          # fs::read, fs::create_dir -- which do their short-I/O completion
          # inside the library where the program cannot see it. `rustc` is the
          # toolchain this job already builds the workspace with, so this needs
          # no new setup, and `experiments/` is not a workspace member so the
          # file is invisible to cargo.
          rustc --edition 2021 -O experiments/fixtures/umbra-userspace-rustio.rs \
            -o "$fixture_dir/umbra-userspace-rustio"
          # The buffered-output pair, and they are only worth building together.
          # The C one writes the same payload three ways -- bare write(2), then
          # checked stdio, then stdio whose fclose result is discarded -- and the
          # Rust one writes it through a BufWriter with an explicit flush. The
          # comparison is the measurement: stdio's flush reaches the kernel as
          # __write_nocancel(397), which has no row in TRACED_STUBS -- so no
          # breakpoint covers it -- and which DYLD_INTERPOSE cannot rebind
          # because the call is issued from inside the dyld shared cache.
          # Breakpoints themselves do fire in there: fopen's 398 and fclose's
          # 399 route normally on this very path, which is why only the bytes
          # are lost and the object is left existing and empty -- at exit 0 in
          # the discarded case.
          # std's final write is compiled into the executable, so it routes and
          # lands. Two of the stdio cases characterize issue #127 and are
          # deliberately green on today's wrong answer; the fix turns them red.
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-stdio.c \
            -o "$fixture_dir/umbra-userspace-stdio"
          rustc --edition 2021 -O experiments/fixtures/umbra-userspace-buffered.rs \
            -o "$fixture_dir/umbra-userspace-buffered"
          # The no-follow walk fixture. The only one here that composes two
          # routed opens -- a directory with `O_SEARCH`, then the leaf with
          # `openat` relative to the virtual descriptor that returned -- which is
          # how its cases ask which COMPONENT `O_NOFOLLOW` governs. Built here
          # rather than compiled per-invocation because this job runs the suite
          # eight times.
          rustc --edition 2021 -O experiments/fixtures/umbra-userspace-nofollow.rs \
            -o "$fixture_dir/umbra-userspace-nofollow"
          # The symlink-read fixture. Its two cases ask the namespace to read
          # back a symlink the run created in its own shadow -- `readlink`(58)
          # on the whole path, and `readlinkat`(473) on the name relative to a
          # descriptor for its parent -- which are two TRACED_STUBS rows
          # decoding to one `FsOp::ReadLink`. Measured: both END THE RUN,
          # because that engine arm requires a buffer no production caller
          # binds. Built here rather than compiled per-invocation for the
          # reason above: this job runs the suite eight times.
          rustc --edition 2021 -O experiments/fixtures/umbra-userspace-metadata.rs \
            -o "$fixture_dir/umbra-userspace-metadata"
          # The process-lifecycle fixture and its exec'd half. Two binaries
          # rather than one, because the `execenv` case's child execs a
          # DIFFERENT image and a separate program is the honest way to be one:
          # umbra caches each tracee as a resigned twin at
          # `<sha256 of contents>/<basename>`, so the edge fixture -- whose
          # exec'd half is a case of itself -- has to be copied to a new
          # basename by the harness to avoid resigning to the launch target's
          # own twin, while a genuinely different program hashes differently
          # and needs no copy. Its `sharedofd` case asserts that a forked
          # child's write and its parent's next write share one offset
          # (`seedchildparent`, #172's regression case), and this workflow
          # carries no `continue-on-error` on any step, so a RED `sharedofd`
          # fails the job. Built here
          # rather than compiled per-invocation because this job runs the suite
          # eight times.
          rustc --edition 2021 -O experiments/fixtures/umbra-userspace-lifecycle.rs \
            -o "$fixture_dir/umbra-userspace-lifecycle"
          rustc --edition 2021 -O experiments/fixtures/umbra-userspace-envwriter.rs \
            -o "$fixture_dir/umbra-userspace-envwriter"
          # Rank 13: C primitives and Rust File::try_lock share reporting only.
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          clang -arch arm64 -O1 experiments/fixtures/umbra-slate-r13-primitives.c -o "$fixture_dir/c13-primitives"
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          clang -arch arm64 -O1 -DC13_RUST_BRIDGE -c experiments/fixtures/umbra-slate-r13-primitives.c -o "$fixture_dir/c13-bridge.o"
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          rustc --edition 2021 -O experiments/fixtures/umbra-slate-r13-lock.rs -C "link-arg=$fixture_dir/c13-bridge.o" -o "$fixture_dir/c13-rust-lock"
          echo "UMBRA_C13_C_PATH=$fixture_dir/c13-primitives" >> "$GITHUB_ENV"
          echo "UMBRA_C13_RUST_PATH=$fixture_dir/c13-rust-lock" >> "$GITHUB_ENV"
          mkdir -p "/tmp/slate-evidence-$GITHUB_RUN_ID"
          echo "UMBRA_SLATE_EVIDENCE=/tmp/slate-evidence-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "UMBRA_USERSPACE_TOY_PATH=$fixture_dir/umbra-userspace-toy" >> "$GITHUB_ENV"
          echo "UMBRA_USERSPACE_LISTING_PATH=$fixture_dir/umbra-userspace-listing" >> "$GITHUB_ENV"
          echo "UMBRA_USERSPACE_LISTING_PROJECT_PATH=$fixture_dir/umbra-userspace-listing-project" >> "$GITHUB_ENV"
          echo "UMBRA_EDGES_PATH=$fixture_dir/umbra-userspace-edges" >> "$GITHUB_ENV"
          echo "UMBRA_RUSTIO_PATH=$fixture_dir/umbra-userspace-rustio" >> "$GITHUB_ENV"
          echo "UMBRA_STDIO_PATH=$fixture_dir/umbra-userspace-stdio" >> "$GITHUB_ENV"
          echo "UMBRA_BUFFERED_PATH=$fixture_dir/umbra-userspace-buffered" >> "$GITHUB_ENV"
          echo "UMBRA_NOFOLLOW_PATH=$fixture_dir/umbra-userspace-nofollow" >> "$GITHUB_ENV"
          echo "UMBRA_METADATA_PATH=$fixture_dir/umbra-userspace-metadata" >> "$GITHUB_ENV"
          echo "UMBRA_LIFECYCLE_PATH=$fixture_dir/umbra-userspace-lifecycle" >> "$GITHUB_ENV"
          echo "UMBRA_ENVWRITER_PATH=$fixture_dir/umbra-userspace-envwriter" >> "$GITHUB_ENV"
          # The standard-utilities matrix reads `UMBRA_TEST_FIXTURE_PATH` as a
          # *provisioning signal* and never launches what it points at: it is
          # the suite's existing marker for "this host has workspace binaries
          # built and debugger permission granted", which is what a traced
          # launch of an Apple binary needs. Pointed at the toy this step
          # already produced rather than inventing a second switch.
          #
          # Without this line the matrix took its gate and reported `ok` while
          # testing nothing, in a job whose name claims the opposite. It is a
          # hard failure now rather than a skip -- the test reads the variable
          # through the file's `input()` helper, which asserts under
          # `UMBRA_INTEGRATION_REQUIRED`, set for this whole job.
          echo "UMBRA_TEST_FIXTURE_PATH=$fixture_dir/umbra-userspace-toy" >> "$GITHUB_ENV"

      # Eight invocations, because the mutation probes are cargo features and no
      # two may be enabled at once. The order matters: the baseline runs against
      # unmutated binaries, and each probe run is preceded by the build that
      # puts its probe in.
      #
      # **Two crates carry probes, and which one decides the build command.**
      # A, B, C and G are features of `umbra-overlay` and F is one of
      # `umbra-supervisor`, all forwarded to `umbra-cli`, so they go into
      # `target/debug/umbra`.
      # D and E are features of `umbra-platform-macos`, which is a provider
      # *executable* the registry names rather than a library `umbra` links, so
      # they go into `target/debug/umbra-platform-macos` and
      # `cargo build -p umbra-cli --features mutation-probe-mkdir` does not
      # exist. Because they are different binaries, a probe on one does **not**
      # clear a probe on the other: Proof 5 restores `umbra` explicitly before
      # mutating the provider, or it would run with two probes live and prove
      # nothing about either.
      #
      # Each one selects `--test userspace_run` and carries `--test-threads=1`,
      # and both are load-bearing rather than stylistic. The selector keeps this
      # gate off the crate's unit suite, which contains a **pre-existing** flaky
      # case -- `transport::raw::c_boundary::r3_004_...` compares a global arena
      # count against a baseline taken earlier in the same test, which races its
      # sibling `c_boundary` tests and failed 1 run in 4 under round-2 review.
      # That file is byte-identical to master and the Linux `transport-raw` job
      # already runs it single-threaded; this job must not start failing on a
      # defect this change did not introduce. The thread limit is what the live
      # cases themselves need: they drive one `umbra run` at a time against one
      # shared Ganesha export and one `target/debug/umbra`.
      #
      # If a future edit widens the selector to `--tests` or `--lib`, it must
      # keep `--test-threads=1` **and** add
      # `--skip the_namespace_mutations_the_hotfix_added_run_end_to_end`.
      # That case asks REMOVE for atomic `change_info4`, which Ganesha's VFS
      # FSAL cannot supply, so it fails against this fixture on `master` too --
      # reproduced byte-identical at `master@155601be`. The Linux
      # `transport-raw` job above already skips it by name for exactly this
      # reason (see its comment); this job stays green only because
      # `--test userspace_run` never reaches it. Widening the selector without
      # the skip reddens the job on a fixture gap this change did not cause.
      - name: Build rank-12 publication fixtures
        run: |
          df -h /System/Volumes/Data
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          cargo build -p umbra-core -p umbra-storage -p umbra-storage-nfs-userspace --features umbra-storage-nfs-userspace/transport-raw --lib
          python3 experiments/fixtures/umbra-slate-r12-build.py
          echo "UMBRA_R12_PATH=$GITHUB_WORKSPACE/target/debug/slate-r12/publication" >> "$GITHUB_ENV"
          echo "UMBRA_R12_PROVIDER=$GITHUB_WORKSPACE/target/debug/slate-r12/provider" >> "$GITHUB_ENV"

      - name: Build rank-15 alias fixtures
        run: |
          df -h /System/Volumes/Data
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          clang -arch arm64 -O1 experiments/fixtures/umbra-slate-r15-alias.c -o "$GITHUB_WORKSPACE/target/debug/c15-alias"
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          clang -arch arm64 -O1 -DC15_HELPER experiments/fixtures/umbra-slate-r15-alias.c -o "$GITHUB_WORKSPACE/target/debug/c15-helper"
          echo "UMBRA_C15_PATH=$GITHUB_WORKSPACE/target/debug/c15-alias" >> "$GITHUB_ENV"
          echo "UMBRA_C15_HELPER=$GITHUB_WORKSPACE/target/debug/c15-helper" >> "$GITHUB_ENV"
          echo "UMBRA_SLATE_R15_EVIDENCE=/tmp/slate-evidence-$GITHUB_RUN_ID/rank15-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Build pinned rank-14 SQLite fixture
        run: |
          df -h /System/Volumes/Data
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          cargo build --locked --manifest-path experiments/fixtures/umbra-slate-r14-sqlite/Cargo.toml --target-dir "$GITHUB_WORKSPACE/target"
          echo "UMBRA_SLATE_R14_PATH=$GITHUB_WORKSPACE/target/debug/umbra-slate-r14-sqlite" >> "$GITHUB_ENV"
          echo "UMBRA_SLATE_R14_EVIDENCE=/tmp/slate-evidence-$GITHUB_RUN_ID/rank14-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Build rank-17 native watcher fixtures
        run: |
          df -h /System/Volumes/Data
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          cargo build --locked --manifest-path experiments/fixtures/umbra-slate-r17-notify/Cargo.toml --target-dir "$GITHUB_WORKSPACE/target"
          cc -Wall -Wextra -Werror experiments/fixtures/umbra-slate-r17-vnode.c -o "$GITHUB_WORKSPACE/target/debug/umbra-slate-r17-vnode"
          echo "UMBRA_R17_NOTIFY_PATH=$GITHUB_WORKSPACE/target/debug/umbra-slate-r17-notify" >> "$GITHUB_ENV"
          echo "UMBRA_R17_VNODE_PATH=$GITHUB_WORKSPACE/target/debug/umbra-slate-r17-vnode" >> "$GITHUB_ENV"
          echo "UMBRA_SLATE_R17_EVIDENCE=/tmp/slate-evidence-$GITHUB_RUN_ID/rank17-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Build pinned rank-16 publication fixture
        run: |
          df -h /System/Volumes/Data
          test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
          # The fixture builds umbra's own crates by path, so its lock also holds
          # their transitive dependencies, which a workspace dependency bump
          # moves (#239). Re-lock only those four packages: the bump flows in,
          # and the `=` pins on tempfile and rustix, the Codex-facing versions,
          # stay exact. The diff stat records what moved.
          cargo update --manifest-path experiments/fixtures/umbra-slate-r16-publication/Cargo.toml \
            -p umbra-cli -p umbra-core -p umbra-supervisor -p umbra-isolation
          git diff --stat -- experiments/fixtures/umbra-slate-r16-publication/Cargo.lock
          cargo build --locked --manifest-path experiments/fixtures/umbra-slate-r16-publication/Cargo.toml --target-dir "$GITHUB_WORKSPACE/target"
          echo "UMBRA_SLATE_R16_PATH=$GITHUB_WORKSPACE/target/debug/umbra-slate-r16-publication" >> "$GITHUB_ENV"

      - name: Build descriptor and sibling-progress controls
        run: |
          for fixture in fdflags native-fcntl lock-progress; do
            test "$(df -k /System/Volumes/Data | awk 'NR==2 {print $4}')" -ge 5242880
            clang -arch arm64 -O1 -Wall -Wextra -Werror "experiments/fixtures/umbra-fix-227-$fixture.c" -o "$GITHUB_WORKSPACE/target/debug/umbra-fix-227-$fixture"
          done
          echo "UMBRA_FIX_227_FDFLAGS_PATH=$GITHUB_WORKSPACE/target/debug/umbra-fix-227-fdflags" >> "$GITHUB_ENV"
