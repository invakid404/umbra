name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # New namespace excludes older archives that contained target/.
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test contract documentation
        run: cargo test --workspace --doc

      - name: Install memoria CLI
        run: cargo install --locked --git https://github.com/viktordanov/rs-memoria --tag v0.4.0 rs-memoria
        # Pinned to rs-memoria's v0.4.0 tag; bump on new releases.

      - name: Memoria documentation gate
        run: memoria --root . check

  raw-transport:
    name: Raw NFS transport (ubuntu-latest)
    # The transport-raw suite links libnfs and drives NFSv4.0 straight over TCP
    # to a Ganesha fixture. Both prerequisites are Linux-only in this shape, so
    # this job does not join the `rust` matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # libnfs.pin is the source of truth; anything else must equal it.
      LIBNFS_PIN: 18c5c73ee88bb7dc8da0d55dc95164bb77e49dc6
      UMBRA_LIBNFS_SRC: ${{ github.workspace }}/third_party/libnfs
      UMBRA_NFS_RAW_FIXTURE: 127.0.0.1:12105
      UMBRA_NFS_FIXTURE_CONTAINER: umbra-m1-transport-raw-ganesha
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Install libnfs build dependencies
        # cmake drives the libnfs build; libclang-dev is bindgen's requirement.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-raw-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-raw-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache pinned libnfs checkout
        id: libnfs-cache
        uses: actions/cache@v6.1.0
        with:
          path: third_party/libnfs
          # The pin is the entire cache identity; a bump invalidates cleanly.
          key: libnfs-src-${{ hashFiles('crates/umbra-storage-nfs-userspace/libnfs.pin') }}

      - name: Verify libnfs.pin matches workflow constant
        run: |
          pinned=$(grep -v '^\s*#' crates/umbra-storage-nfs-userspace/libnfs.pin | tr -d '[:space:]')
          if [ "$pinned" != "$LIBNFS_PIN" ]; then
            echo "libnfs.pin says $pinned but this workflow expects $LIBNFS_PIN" >&2
            exit 1
          fi

      - name: Fetch pinned libnfs source
        if: steps.libnfs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          git clone --filter=blob:none https://github.com/sahlberg/libnfs third_party/libnfs
          git -C third_party/libnfs -c advice.detachedHead=false checkout "$LIBNFS_PIN"

      - name: Build and start the NFS-Ganesha fixture
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            up -d --build --wait --wait-timeout 120
          docker ps --filter name=$UMBRA_NFS_FIXTURE_CONTAINER

      - name: Run transport-raw suite
        # `--tests` runs unit tests inside the crate and every integration
        # target under `tests/`. `--test-threads=1` is required by the live
        # cases that restart the fixture (`tests/live_state.rs`); the tests
        # can otherwise clobber each other on the shared server.
        #
        # The 10 finding-tagged tests named in issue #32 (four each in
        # `pump.rs` and `mod.rs`, two in `tests/live_state.rs`, one in
        # `tests/fault_matrix.rs`) all execute and pass under this fixture,
        # alongside the rest of the raw-transport suite.
        #
        # `--skip the_namespace_mutations_the_hotfix_added_run_end_to_end`:
        # the raw transport asks REMOVE for atomic `change_info4`
        # (RFC 7530 §14.2), which NFS-Ganesha's VFS FSAL cannot supply
        # because `unlinkat(2)` yields no atomic before/after
        # directory-change tracking. This is a fixture-capability gap, not
        # a code gap; the same test passes under the mounted adapter in
        # `crates/umbra-storage-nfs`. Lifting the skip is tracked as future
        # work once a Ganesha FSAL with atomic REMOVE lands here.
        run: |
          cargo test \
              -p umbra-storage-nfs-userspace \
              --features transport-raw \
              --tests \
              -- --test-threads=1 --nocapture \
              --skip the_namespace_mutations_the_hotfix_added_run_end_to_end

      - name: Print Ganesha logs on failure
        if: failure()
        run: |
          docker logs "$UMBRA_NFS_FIXTURE_CONTAINER" 2>&1 | tail -200
          docker inspect "$UMBRA_NFS_FIXTURE_CONTAINER" \
            --format '{{json .State.Health}}' 2>&1 || true

      - name: Tear down the fixture
        if: always()
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            down -v

  native-qualification:
    name: Enforced macOS fixture qualification
    # Fork PR code must never run on this persistent, privileged runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # This runner must provide debugger permission and an existing NFSv4 mount.
    runs-on: [self-hosted, macOS, ARM64, umbra-integration]
    timeout-minutes: 15
    env:
      UMBRA_INTEGRATION_REQUIRED: "1"
      # Opt out of nfs_fixture_matrix in CI. The live-NFSv4-mount end-to-end
      # test remains in the suite and runs in local dev; on macOS Sequoia/Tahoe
      # self-hosted runners the TCC SystemPolicyNetworkVolumes gate blocks
      # openat on the mount point from a launchd context, and the PPPC
      # bypass would require user-approved MDM. A userspace NFSv4 client
      # backend that removes the local-mount requirement is planned; when
      # it lands the skip can be removed.
      UMBRA_TEST_SKIP_NFS_MATRIX: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build providers and fixture
        run: |
          test "$(uname -m)" = arm64
          cargo build --workspace --bins
          fixture_dir=$(mktemp -d)
          clang -arch arm64 experiments/fixtures/umbra-test-child.c -o "$fixture_dir/umbra-test-child"
          mkdir "$fixture_dir/shadow"
          echo "UMBRA_TEST_FIXTURE_PATH=$fixture_dir/umbra-test-child" >> "$GITHUB_ENV"
          echo "UMBRA_TEST_REDIRECT_ROOT=$fixture_dir/shadow" >> "$GITHUB_ENV"
      - name: Qualify enforcement, IPC, and the local run-fixture matrix
        run: |
          cargo test -p umbra-platform-macos --test sandbox_launch --test provider_ipc --test fixtures -- --nocapture --test-threads=1
          cargo test -p umbra-cli --test run_fixtures -- --nocapture --test-threads=1
