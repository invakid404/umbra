name: CI

on:
  push:
    branches: [master]
  pull_request:

# One in-flight run per ref; superseded runs cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # New namespace excludes older archives that contained target/.
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check workspace
        run: cargo check --workspace --all-targets

      # `cargo test` compiles other packages' `[[bin]]` targets only as test
      # harnesses under `deps/`, so `target/debug/umbra-storage-local` and
      # friends do not exist on a clean checkout. The reopen suites spawn those
      # provider executables, and without this they would skip here and run
      # nowhere. Linking them is cheap at this point: every dependency is already
      # built by the three steps above.
      - name: Build provider executables for the suites that spawn them
        run: cargo build --workspace --bins

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Test contract documentation
        run: cargo test --workspace --doc

      - name: Install memoria CLI
        run: cargo install --locked --git https://github.com/viktordanov/rs-memoria --tag v0.4.0 rs-memoria
        # Pinned to rs-memoria's v0.4.0 tag; bump on new releases.

      - name: Memoria documentation gate
        run: memoria --root . check

  raw-transport:
    name: Raw NFS transport (ubuntu-latest)
    # The transport-raw suite links libnfs and drives NFSv4.0 straight over TCP
    # to a Ganesha fixture. Both prerequisites are Linux-only in this shape, so
    # this job does not join the `rust` matrix.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # libnfs.pin is the source of truth; anything else must equal it.
      LIBNFS_PIN: 18c5c73ee88bb7dc8da0d55dc95164bb77e49dc6
      UMBRA_LIBNFS_SRC: ${{ github.workspace }}/third_party/libnfs
      UMBRA_NFS_RAW_FIXTURE: 127.0.0.1:12105
      UMBRA_NFS_FIXTURE_CONTAINER: umbra-m1-transport-raw-ganesha
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain components
        # rustup honors the repository's rust-toolchain.toml.
        run: rustup component add rustfmt clippy

      - name: Install libnfs build dependencies and tcpdump
        # cmake drives the libnfs build; libclang-dev is bindgen's
        # requirement. tcpdump is for the wire capture below, kept in the
        # same apt call to save one package-cache update.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libclang-dev tcpdump

      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-raw-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-raw-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Cache pinned libnfs checkout
        id: libnfs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/libnfs
          # The pin is the entire cache identity; a bump invalidates cleanly.
          key: libnfs-src-${{ hashFiles('crates/umbra-storage-nfs-userspace/libnfs.pin') }}

      - name: Verify libnfs.pin matches workflow constant
        run: |
          pinned=$(grep -v '^\s*#' crates/umbra-storage-nfs-userspace/libnfs.pin | tr -d '[:space:]')
          if [ "$pinned" != "$LIBNFS_PIN" ]; then
            echo "libnfs.pin says $pinned but this workflow expects $LIBNFS_PIN" >&2
            exit 1
          fi

      - name: Fetch pinned libnfs source
        if: steps.libnfs-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p third_party
          git clone --filter=blob:none https://github.com/sahlberg/libnfs third_party/libnfs
          git -C third_party/libnfs -c advice.detachedHead=false checkout "$LIBNFS_PIN"

      - name: Build and start the NFS-Ganesha fixture
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            up -d --build --wait --wait-timeout 120
          docker ps --filter name=$UMBRA_NFS_FIXTURE_CONTAINER

      - name: Start wire capture on loopback
        # `-U` flushes each packet so a kill-signalled process still leaves a
        # usable file. The filter matches the published port (12105 on host
        # loopback) and the container's own port (2049) so both sides of the
        # docker-proxy relay are recorded.
        #
        # The redirections have to run *inside* the elevated shell, otherwise
        # sh opens the output files under the runner UID before executing
        # `sudo tcpdump` (SC2024). Wrap the whole invocation in `sudo sh -c`
        # so both the fd creation and the process itself are root.
        run: |
          sudo sh -c 'tcpdump -i any -w /tmp/nfs.pcap -U -s 0 \
              "port 12105 or port 2049" \
              > /tmp/tcpdump.stdout 2> /tmp/tcpdump.stderr &
              echo $! > /tmp/tcpdump.pid'
          # Let libpcap open its BPF filter before tests start dispatching.
          sleep 2

      - name: Run transport-raw suite
        # `--tests` runs unit tests inside the crate and every integration
        # target under `tests/`. `--test-threads=1` is required by the live
        # cases that restart the fixture (`tests/live_state.rs`); the tests
        # can otherwise clobber each other on the shared server.
        #
        # The 10 finding-tagged tests named in issue #32 — four in
        # `src/transport/raw/pump.rs`, three in `src/transport/raw/mod.rs`,
        # two in `tests/live_state.rs`, and one in `tests/fault_matrix.rs` —
        # all execute and pass under this fixture, alongside the rest of
        # the raw-transport suite.
        #
        # `--skip the_namespace_mutations_the_hotfix_added_run_end_to_end`:
        # the raw transport asks REMOVE for atomic `change_info4`
        # (RFC 7530 §14.2), which NFS-Ganesha's VFS FSAL cannot supply
        # because `unlinkat(2)` yields no atomic before/after
        # directory-change tracking. This is a fixture-capability gap, not
        # a code gap; the same test passes under the mounted adapter in
        # `crates/umbra-storage-nfs`. Lifting the skip is tracked as future
        # work once a Ganesha FSAL with atomic REMOVE lands here.
        run: |
          cargo test \
              -p umbra-storage-nfs-userspace \
              --features transport-raw \
              --tests \
              -- --test-threads=1 --nocapture \
              --skip the_namespace_mutations_the_hotfix_added_run_end_to_end

      - name: Stop wire capture
        if: always()
        run: |
          if [ -f /tmp/tcpdump.pid ]; then
            sudo kill -INT "$(cat /tmp/tcpdump.pid)" 2>/dev/null || true
            # Give tcpdump a moment to finish flushing.
            sleep 1
          fi
          sudo chown "$USER" /tmp/nfs.pcap 2>/dev/null || true
          ls -l /tmp/nfs.pcap 2>&1 || true

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker logs "$UMBRA_NFS_FIXTURE_CONTAINER" \
            > /tmp/ganesha.log 2>&1 || true
          docker inspect "$UMBRA_NFS_FIXTURE_CONTAINER" \
            --format '{{json .State.Health}}' \
            > /tmp/ganesha-health.json 2>&1 || true
          echo '--- Ganesha log (last 200 lines) ---'
          tail -200 /tmp/ganesha.log
          echo '--- Health state ---'
          cat /tmp/ganesha-health.json
          echo

      - name: Upload raw-transport diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-transport-diagnostics
          path: |
            /tmp/nfs.pcap
            /tmp/ganesha.log
            /tmp/ganesha-health.json
            /tmp/tcpdump.stdout
            /tmp/tcpdump.stderr
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down the fixture
        if: always()
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            down -v

  native-qualification:
    name: Enforced macOS fixture qualification
    # Fork PR code must never run on this persistent, privileged runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # This runner must provide debugger permission and an existing NFSv4 mount.
    runs-on: [self-hosted, macOS, ARM64, umbra-integration]
    timeout-minutes: 15
    env:
      UMBRA_INTEGRATION_REQUIRED: "1"
      # Opt out of nfs_fixture_matrix in CI. The live-NFSv4-mount end-to-end
      # test remains in the suite and runs in local dev; on macOS Sequoia/Tahoe
      # self-hosted runners the TCC SystemPolicyNetworkVolumes gate blocks
      # openat on the mount point from a launchd context, and the PPPC
      # bypass would require user-approved MDM. A userspace NFSv4 client
      # backend that removes the local-mount requirement is planned; when
      # it lands the skip can be removed.
      UMBRA_TEST_SKIP_NFS_MATRIX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build providers and fixture
        run: |
          test "$(uname -m)" = arm64
          cargo build --workspace --bins
          fixture_dir=$(mktemp -d)
          clang -arch arm64 experiments/fixtures/umbra-test-child.c -o "$fixture_dir/umbra-test-child"
          mkdir "$fixture_dir/shadow"
          echo "UMBRA_TEST_FIXTURE_PATH=$fixture_dir/umbra-test-child" >> "$GITHUB_ENV"
          echo "UMBRA_TEST_REDIRECT_ROOT=$fixture_dir/shadow" >> "$GITHUB_ENV"
      - name: Qualify enforcement, IPC, and the local run-fixture matrix
        run: |
          cargo test -p umbra-platform-macos --test sandbox_launch --test provider_ipc --test fixtures -- --nocapture --test-threads=1
          cargo test -p umbra-cli --test run_fixtures --test resume_cli -- --nocapture --test-threads=1
          cargo test -p umbra-supervisor --test reopen -- --nocapture --test-threads=1

  native-userspace-routing:
    name: Userspace-routed run over the live NFSv4 client
    # Fork PR code must never run on this persistent, privileged runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The same runner as `native-qualification`: it provides debugger
    # permission, which a supervised launch needs, and Docker for the fixture.
    # A routed run needs both halves and neither is available elsewhere -- the
    # Linux transport-raw job has the server but no tracer, and the macOS
    # qualification job has the tracer but no server.
    runs-on: [self-hosted, macOS, ARM64, umbra-integration]
    timeout-minutes: 30
    env:
      # A missing fixture is a failure here, not a skip. These are the slice's
      # mandatory proofs: an end-to-end run, and two mutations that must break
      # it in different directions.
      UMBRA_INTEGRATION_REQUIRED: "1"
      LIBNFS_PIN: 18c5c73ee88bb7dc8da0d55dc95164bb77e49dc6
      UMBRA_LIBNFS_SRC: ${{ github.workspace }}/third_party/libnfs
      UMBRA_NFS_RAW_FIXTURE: 127.0.0.1:12105
      UMBRA_NFS_FIXTURE_CONTAINER: umbra-m1-transport-raw-ganesha
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify libnfs.pin matches workflow constant
        run: |
          pinned=$(grep -v '^\s*#' crates/umbra-storage-nfs-userspace/libnfs.pin | tr -d '[:space:]')
          if [ "$pinned" != "$LIBNFS_PIN" ]; then
            echo "libnfs.pin says $pinned but this workflow expects $LIBNFS_PIN" >&2
            exit 1
          fi

      - name: Fetch pinned libnfs source
        run: |
          if [ ! -d third_party/libnfs ]; then
            mkdir -p third_party
            git clone --filter=blob:none https://github.com/sahlberg/libnfs third_party/libnfs
          fi
          git -C third_party/libnfs fetch --depth 1 origin "$LIBNFS_PIN" || true
          git -C third_party/libnfs -c advice.detachedHead=false checkout "$LIBNFS_PIN"

      - name: Build and start the NFS-Ganesha fixture
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            up -d --build --wait --wait-timeout 180
          docker ps --filter name=$UMBRA_NFS_FIXTURE_CONTAINER

      - name: Build the toy and edge fixtures
        run: |
          test "$(uname -m)" = arm64
          fixture_dir=$(mktemp -d)
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-toy.c \
            -o "$fixture_dir/umbra-userspace-toy"
          # The edge fixture carries the round-1 regressions: a routed ENOENT, a
          # routed EFAULT, a transfer past the backend's per-call bound, an
          # O_TRUNC of a non-empty object, and a file-touching library
          # initializer. Each was a dead run or a wrong errno.
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-edges.c \
            -o "$fixture_dir/umbra-userspace-edges"
          # The listing fixture reads a directory through `fts` with the flags
          # plain `/bin/ls` passes and writes the names it got into the routed
          # workspace. It is how the directory-read proofs assert on *entries*:
          # a traced tracee inherits the provider's `Stdio::null()` standard
          # output, so `ls`'s own listing is unreadable by any harness, and an
          # exit code cannot tell a correct listing from an empty one.
          clang -arch arm64 -O1 experiments/fixtures/umbra-userspace-listing.c \
            -o "$fixture_dir/umbra-userspace-listing"
          echo "UMBRA_USERSPACE_TOY_PATH=$fixture_dir/umbra-userspace-toy" >> "$GITHUB_ENV"
          echo "UMBRA_USERSPACE_LISTING_PATH=$fixture_dir/umbra-userspace-listing" >> "$GITHUB_ENV"
          echo "UMBRA_EDGES_PATH=$fixture_dir/umbra-userspace-edges" >> "$GITHUB_ENV"
          # The standard-utilities matrix reads `UMBRA_TEST_FIXTURE_PATH` as a
          # *provisioning signal* and never launches what it points at: it is
          # the suite's existing marker for "this host has workspace binaries
          # built and debugger permission granted", which is what a traced
          # launch of an Apple binary needs. Pointed at the toy this step
          # already produced rather than inventing a second switch.
          #
          # Without this line the matrix took its gate and reported `ok` while
          # testing nothing, in a job whose name claims the opposite. It is a
          # hard failure now rather than a skip -- the test reads the variable
          # through the file's `input()` helper, which asserts under
          # `UMBRA_INTEGRATION_REQUIRED`, set for this whole job.
          echo "UMBRA_TEST_FIXTURE_PATH=$fixture_dir/umbra-userspace-toy" >> "$GITHUB_ENV"

      # Six invocations, because the mutation probes are cargo features and no
      # two may be enabled at once. The order matters: the baseline runs against
      # unmutated binaries, and each probe run is preceded by the build that
      # puts its probe in.
      #
      # **Two crates carry probes, and which one decides the build command.**
      # A, B and C are features of `umbra-overlay`, forwarded through
      # `umbra-supervisor` to `umbra-cli`, so they go into `target/debug/umbra`.
      # D and E are features of `umbra-platform-macos`, which is a provider
      # *executable* the registry names rather than a library `umbra` links, so
      # they go into `target/debug/umbra-platform-macos` and
      # `cargo build -p umbra-cli --features mutation-probe-mkdir` does not
      # exist. Because they are different binaries, a probe on one does **not**
      # clear a probe on the other: Proof 5 restores `umbra` explicitly before
      # mutating the provider, or it would run with two probes live and prove
      # nothing about either.
      #
      # Each one selects `--test userspace_run` and carries `--test-threads=1`,
      # and both are load-bearing rather than stylistic. The selector keeps this
      # gate off the crate's unit suite, which contains a **pre-existing** flaky
      # case -- `transport::raw::c_boundary::r3_004_...` compares a global arena
      # count against a baseline taken earlier in the same test, which races its
      # sibling `c_boundary` tests and failed 1 run in 4 under round-2 review.
      # That file is byte-identical to master and the Linux `transport-raw` job
      # already runs it single-threaded; this job must not start failing on a
      # defect this change did not introduce. The thread limit is what the live
      # cases themselves need: they drive one `umbra run` at a time against one
      # shared Ganesha export and one `target/debug/umbra`.
      #
      # If a future edit widens the selector to `--tests` or `--lib`, it must
      # keep `--test-threads=1` **and** add
      # `--skip the_namespace_mutations_the_hotfix_added_run_end_to_end`.
      # That case asks REMOVE for atomic `change_info4`, which Ganesha's VFS
      # FSAL cannot supply, so it fails against this fixture on `master` too --
      # reproduced byte-identical at `master@155601be`. The Linux
      # `transport-raw` job above already skips it by name for exactly this
      # reason (see its comment); this job stays green only because
      # `--test userspace_run` never reaches it. Widening the selector without
      # the skip reddens the job on a fixture gap this change did not cause.
      - name: Proof 1 -- end to end, the toy must exit 0
        run: |
          cargo build --workspace --bins
          cargo build -p umbra-storage-nfs-userspace --features transport-raw --bins
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Proof 2 -- mutation probe A, read routing broken
        env:
          UMBRA_MUTATION_PROBE: read
        run: |
          cargo build -p umbra-cli --features mutation-probe-read
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Proof 3 -- mutation probe B, write routing broken
        env:
          UMBRA_MUTATION_PROBE: write
        run: |
          cargo build -p umbra-cli --features mutation-probe-write
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Proof 4 -- mutation probe C, fstat answers EBADF
        env:
          UMBRA_MUTATION_PROBE: fstat
        run: |
          cargo build -p umbra-cli --features mutation-probe-fstat
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Proof 5 -- mutation probe D, the mkdir decode arm removed
        env:
          UMBRA_MUTATION_PROBE: mkdir
        run: |
          # Clear probe C from `umbra` first. This probe is on a different
          # binary, so building it does not rebuild `umbra`, and leaving the
          # previous feature in place would put two probes in one run.
          cargo build -p umbra-cli
          cargo build -p umbra-platform-macos --features mutation-probe-mkdir
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Proof 6 -- mutation probe E, setattrlistat refused
        env:
          UMBRA_MUTATION_PROBE: setattrlistat
        run: |
          # Same crate as probe D, so this feature swap rebuilds the provider
          # and clears the previous probe on its own. `umbra` is already clean.
          cargo build -p umbra-platform-macos --features mutation-probe-setattrlistat
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Proof 7 -- mutation probe F, directory reply names corrupted
        env:
          UMBRA_MUTATION_PROBE: readdir
        run: |
          # Clear probe E from the provider first, for Proof 5's reason in the
          # other direction: this probe is on `umbra`, so building it does not
          # rebuild `umbra-platform-macos`, and leaving the previous feature in
          # place would put two probes in one run.
          cargo build -p umbra-platform-macos
          cargo build -p umbra-cli --features mutation-probe-readdir
          cargo test -p umbra-storage-nfs-userspace --features transport-raw \
            --test userspace_run -- --nocapture --test-threads=1

      - name: Restore unmutated binaries
        if: always()
        run: |
          # Both, because probes live on two crates. Restoring only `umbra`
          # would leave a mutated provider executable in `target/debug` for
          # whatever runs on this persistent runner next.
          cargo build -p umbra-cli
          cargo build -p umbra-platform-macos

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker logs "$UMBRA_NFS_FIXTURE_CONTAINER" 2>&1 | tail -200 || true

      - name: Tear down the fixture
        if: always()
        run: |
          docker compose \
            -f experiments/nfs-raw/docker-compose.yml \
            down -v
